blueprint:
  name: Light Toggle (Vikings Purple & Gold Pulse / White)
  description: Cycles a light smoothly between Minnesota Vikings Purple and Gold when a helper toggle is turned on, and returns it to crisp White when turned off.
  domain: automation
  input:
    target_light:
      name: Light
      description: Select the Philips Hue light or group to control.
      selector:
        entity:
          domain: light
    control_toggle:
      name: Control Toggle Helper
      description: Select the input_boolean helper switch that triggers the color change.
      selector:
        entity:
          domain: input_boolean
    transition_time:
      name: Pulse Speed (Transition Time)
      description: Seconds taken to fade into the next color. Lower values mean faster pulsing.
      default: 4
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: seconds

mode: restart

trigger:
  - platform: state
    entity_id: !input control_toggle
    to: "on"
    id: start_pulse
  - platform: state
    entity_id: !input control_toggle
    to: "off"
    id: turn_white

action:
  - choose:
      # --- Helper turned ON: Loop Purple and Gold ---
      - conditions:
          - condition: trigger
            id: start_pulse
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: !input control_toggle
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    rgb_color: [88, 44, 131]  # MN Vikings Purple
                    transition: !input transition_time
                - delay:
                    seconds: !input transition_time
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    rgb_color: [255, 199, 44] # MN Vikings Gold
                    transition: !input transition_time
                - delay:
                    seconds: !input transition_time

      # --- Helper turned OFF: Break loop and force White ---
      - conditions:
          - condition: trigger
            id: turn_white
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              rgb_color: [255, 255, 255] # Clean White override array
              transition: 2
              
